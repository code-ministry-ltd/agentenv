name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: ci (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.12', 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and test
        run: npm run ci

      - name: Offline suite
        run: npm run test:offline

      - name: Migration suite
        run: npm run test:migration

      # Packs the release artifact, installs it into a clean prefix, and drives the
      # README's own instructions against the INSTALLED binary: build an env on a
      # simulated machine A, push it to a bare remote, restore it on machine B with
      # `init --remote`, and assert it materialised on two harnesses. Fully
      # sandboxed (temp AGENTENV_HOME + temp HOME) and offline (file:// remote).
      - name: Pack and install smoke test
        shell: bash
        run: npm run smoke:install

      - name: Clean Node 22 container restore
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.12'
        run: npm run test:restore:container
