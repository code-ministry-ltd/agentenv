name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: ci (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and test
        run: npm run ci

      - name: Package and global-install smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm pack
          tgz=$(ls code-ministry-agentenv-*.tgz)
          prefix="$RUNNER_TEMP/agentenv-global"
          npm i -g "./$tgz" --prefix "$prefix"
          got=$("$prefix/bin/agentenv" --version)
          echo "agentenv --version => $got"
          test "$got" = "0.0.1"
